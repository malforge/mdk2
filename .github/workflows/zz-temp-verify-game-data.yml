name: TEMP Verify Game Data Call

# TEMPORARY, DELETE AFTER VERIFYING. An exact mirror of the game-data job in the release workflow, so the
# workflow_call plumbing, the release publish and the staleness guard get exercised without cutting a release.
# GitHub only offers workflow_dispatch for workflows already on the default branch, which is why this exists at
# all rather than being a manual run.
on:
  push:
    branches:
      - feat/extractor-dedicated-server

jobs:
  game-data:
    permissions:
      contents: write
    uses: ./.github/workflows/extract-game-data.yml
    with:
      publishRelease: true
      failIfAnalyzerDataChanged: true
